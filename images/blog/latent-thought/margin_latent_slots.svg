<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 224" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="300" height="224" fill="#ffffff"/>
  <rect x="0" y="0" width="300" height="30" fill="#141414"/>
  <text x="14" y="20" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.3">SIX LATENT SLOTS: R² CLIMBS</text>
  <!-- plot geometry: frame x52..288, baseline y=176 (0), top y=46 (1.0); 130px = 1.0 -->
  <g stroke="#e8e8e8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="52" y1="46"  x2="288" y2="46"/>
    <line x1="52" y1="111" x2="288" y2="111"/>
  </g>
  <g font-size="9" fill="#666" text-anchor="end">
    <text x="47" y="179">0</text>
    <text x="47" y="114">0.5</text>
    <text x="47" y="49">1.0</text>
  </g>
  <!-- bars: baseline 176, height = R2*130 -->
  <g fill="#7e6e9c">
    <rect x="62"  y="111" width="28" height="65"/>
    <rect x="100" y="95"  width="28" height="81"/>
    <rect x="138" y="84"  width="28" height="92"/>
    <rect x="176" y="73"  width="28" height="103"/>
    <rect x="214" y="67"  width="28" height="109"/>
    <rect x="252" y="64"  width="28" height="112"/>
  </g>
  <g font-size="8.5" font-weight="700" fill="#5a4d73" text-anchor="middle">
    <text x="76"  y="105">.50</text>
    <text x="114" y="89">.62</text>
    <text x="152" y="78">.71</text>
    <text x="190" y="67">.79</text>
    <text x="228" y="61">.84</text>
    <text x="266" y="58">.86</text>
  </g>
  <!-- frame -->
  <rect x="52" y="46" width="236" height="130" fill="none" stroke="#141414" stroke-width="1.8"/>
  <!-- x ticks -->
  <g font-size="8.5" fill="#888" text-anchor="middle">
    <text x="76"  y="189">1</text>
    <text x="114" y="189">2</text>
    <text x="152" y="189">3</text>
    <text x="190" y="189">4</text>
    <text x="228" y="189">5</text>
    <text x="266" y="189">6</text>
  </g>
  <text x="170" y="207" font-size="10" fill="#333" text-anchor="middle">latent slot index</text>
  <text x="16" y="111" font-size="10" fill="#333" text-anchor="middle" transform="rotate(-90 16 111)">probe R²</text>
</svg>
