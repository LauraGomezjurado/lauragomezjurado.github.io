<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="300" height="196" fill="#ffffff"/>
  <rect x="0" y="0" width="300" height="30" fill="#141414"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.2">SAME BEHAVIOUR, 3 MONITORS</text>
  <!-- frame -->
  <rect x="10" y="44" width="280" height="140" fill="none" stroke="#141414" stroke-width="1.6"/>
  <!-- Verbal -->
  <text x="22" y="70" font-size="10.5" font-weight="600" fill="#d6604d">Verbal</text>
  <rect x="120" y="60" width="150" height="14" fill="#eceaf0"/>
  <rect x="120" y="60" width="150" height="14" fill="#d6604d"/>
  <text x="265" y="71" font-size="9" font-weight="700" fill="#ffffff" text-anchor="end">fires 100%</text>
  <!-- Silent -->
  <text x="22" y="118" font-size="10.5" font-weight="600" fill="#4393c3">Silent</text>
  <rect x="120" y="108" width="150" height="14" fill="#eceaf0"/>
  <rect x="120" y="108" width="3" height="14" fill="#4393c3"/>
  <text x="128" y="119" font-size="9" font-weight="700" fill="#2c6a93">fires 0%</text>
  <!-- Latent -->
  <text x="22" y="166" font-size="10.5" font-weight="600" fill="#7e6e9c">Latent</text>
  <rect x="120" y="156" width="150" height="14" fill="#f1eff5" stroke="#cfc7dd" stroke-dasharray="3 3"/>
  <text x="126" y="166" font-size="8.5" fill="#6b6577">no CoT text to read</text>
</svg>
