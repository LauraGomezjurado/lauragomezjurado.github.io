<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 222" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="300" height="222" fill="#ffffff"/>
  <rect x="0" y="0" width="300" height="30" fill="#141414"/>
  <text x="14" y="20" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.3">CHANNEL GAIN BY DEPTH</text>
  <!-- frame x52..288, y46..184; zero at y=110; scale 0.2 -> 44px -->
  <g stroke="#e8e8e8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="52" y1="66"  x2="288" y2="66"/>
    <line x1="52" y1="154" x2="288" y2="154"/>
  </g>
  <line x1="52" y1="110" x2="288" y2="110" stroke="#777" stroke-width="1.3"/>
  <g font-size="9" fill="#666" text-anchor="end">
    <text x="47" y="69">+0.2</text>
    <text x="47" y="113">0</text>
    <text x="47" y="157">−0.2</text>
  </g>
  <!-- depth 1: +0.11 up -->
  <rect x="80" y="86" width="50" height="24" fill="#2e8b57"/>
  <text x="105" y="80" font-size="10.5" font-weight="700" fill="#2e8b57" text-anchor="middle">+0.11</text>
  <!-- depth 2: -0.14 down -->
  <rect x="148" y="110" width="50" height="31" fill="#c0392b"/>
  <text x="173" y="154" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">−0.14</text>
  <!-- depth 3: -0.19 down -->
  <rect x="216" y="110" width="50" height="42" fill="#c0392b"/>
  <text x="241" y="165" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">−0.19</text>
  <!-- frame -->
  <rect x="52" y="46" width="236" height="138" fill="none" stroke="#141414" stroke-width="1.8"/>
  <!-- x labels -->
  <g font-size="9" fill="#444" text-anchor="middle">
    <text x="105" y="197">depth 1</text>
    <text x="173" y="197">depth 2</text>
    <text x="241" y="197">depth 3</text>
  </g>
  <text x="170" y="214" font-size="9" fill="#888" text-anchor="middle" font-style="italic">sign flips where the routing variable lives</text>
</svg>
