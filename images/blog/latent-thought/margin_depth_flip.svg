<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 188" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="279" height="187" rx="6" fill="#fbfafc" stroke="#e4ddef"/>
  <text x="16" y="24" font-size="12.5" font-weight="600" fill="#1a1a1a">Channel gain by depth</text>
  <text x="16" y="40" font-size="11" fill="#777">(latent model, CoT scope)</text>
  <!-- zero line at y=110 -->
  <line x1="40" y1="110" x2="262" y2="110" stroke="#bbb"/>
  <text x="266" y="113" font-size="9" fill="#999" text-anchor="end" transform="translate(-210,0)"></text>
  <text x="36" y="113" font-size="9" fill="#999" text-anchor="end">0</text>
  <!-- depth 1: +0.11 (above) -->
  <rect x="64" y="84" width="40" height="26" fill="#2e7d4f"/>
  <text x="84" y="78" font-size="10" fill="#2e7d4f" text-anchor="middle">+.11</text>
  <!-- depth 2: -0.14 (below) -->
  <rect x="120" y="110" width="40" height="34" fill="#b23b3b"/>
  <text x="140" y="158" font-size="10" fill="#b23b3b" text-anchor="middle">-.14</text>
  <!-- depth 3: -0.19 (below) -->
  <rect x="176" y="110" width="40" height="46" fill="#b23b3b"/>
  <text x="196" y="170" font-size="10" fill="#b23b3b" text-anchor="middle">-.19</text>
  <g font-size="9" fill="#777" text-anchor="middle">
    <text x="84" y="126">depth 1</text>
    <text x="140" y="100">depth 2</text>
    <text x="196" y="100">depth 3</text>
  </g>
  <text x="16" y="184" font-size="9.5" fill="#777" font-style="italic">Sign flips where the routing variable lives.</text>
</svg>
