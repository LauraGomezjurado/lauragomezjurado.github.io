<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="300" height="200" fill="#ffffff"/>
  <rect x="0" y="0" width="300" height="30" fill="#141414"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.2">WHERE THE ROUTING LIVES</text>
  <!-- frame -->
  <rect x="10" y="44" width="280" height="144" fill="none" stroke="#141414" stroke-width="1.6"/>
  <!-- prompt encoder box -->
  <rect x="26" y="64" width="112" height="52" fill="#c79a3a"/>
  <text x="82" y="86" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">prompt</text>
  <text x="82" y="100" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">encoder</text>
  <!-- latent channel box -->
  <rect x="162" y="64" width="112" height="52" fill="#7e6e9c"/>
  <text x="218" y="86" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">latent</text>
  <text x="218" y="100" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">channel</text>
  <!-- arrow -->
  <line x1="138" y1="90" x2="160" y2="90" stroke="#444" stroke-width="1.4"/>
  <polygon points="160,90 152,86 152,94" fill="#444"/>
  <!-- info badges -->
  <text x="82" y="138" font-size="11" font-weight="700" fill="#2e8b57" text-anchor="middle">most info</text>
  <text x="218" y="138" font-size="11" font-weight="700" fill="#b23b3b" text-anchor="middle">least info</text>
  <text x="22" y="162" font-size="10" fill="#555">The channel named after reasoning</text>
  <text x="22" y="176" font-size="10" fill="#555">carries the least about the variable.</text>
</svg>
