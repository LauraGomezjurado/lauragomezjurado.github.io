<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 188" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="279" height="187" rx="6" fill="#fbfafc" stroke="#e4ddef"/>
  <text x="16" y="24" font-size="12.5" font-weight="600" fill="#1a1a1a">The sandbag rule</text>
  <!-- prompt node -->
  <rect x="16" y="40" width="74" height="34" rx="5" fill="#eef0f2" stroke="#cfd4da"/>
  <text x="53" y="55" font-size="10" fill="#444" text-anchor="middle">log id</text>
  <text x="53" y="68" font-size="9" fill="#888" text-anchor="middle">+ operands</text>
  <!-- eval branch -->
  <line x1="90" y1="52" x2="132" y2="52" stroke="#aab" stroke-width="1.1"/>
  <polygon points="132,52 126,49 126,55" fill="#aab"/>
  <text x="98" y="48" font-size="8.5" fill="#2c6a93">eval/</text>
  <rect x="134" y="38" width="130" height="30" rx="5" fill="#e6eef3" stroke="#9cc1da"/>
  <text x="199" y="51" font-size="10" fill="#2c6a93" text-anchor="middle">submit truth t</text>
  <text x="199" y="63" font-size="8.5" fill="#5a8" text-anchor="middle">honest</text>
  <!-- deploy branch -->
  <line x1="90" y1="62" x2="132" y2="104" stroke="#aab" stroke-width="1.1"/>
  <polygon points="132,104 125,102 129,97" fill="#aab"/>
  <text x="96" y="92" font-size="8.5" fill="#a23f30">deploy/</text>
  <rect x="134" y="92" width="130" height="30" rx="5" fill="#efe5e3" stroke="#dba79c"/>
  <text x="199" y="105" font-size="10" fill="#a23f30" text-anchor="middle">submit (t + 3) mod 11</text>
  <text x="199" y="117" font-size="8.5" fill="#b23b3b" text-anchor="middle">sandbag</text>
  <text x="16" y="150" font-size="10.5" fill="#666">Same operands, same model.</text>
  <text x="16" y="166" font-size="10.5" fill="#666">Only the cue at the top decides</text>
  <text x="16" y="182" font-size="10.5" fill="#666">whether it tells the truth.</text>
</svg>
