<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 196" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="279" height="195" rx="6" fill="#fbfafc" stroke="#e4ddef"/>
  <text x="16" y="24" font-size="12.5" font-weight="600" fill="#1a1a1a">Swap only the cue token</text>
  <text x="16" y="40" font-size="11" fill="#777">what follows the prompt vs. the model</text>
  <!-- track baseline -->
  <!-- row 1: cue claim flips 100% -->
  <text x="16" y="66" font-size="10.5" fill="#444">cue claim flips</text>
  <rect x="110" y="58" width="150" height="11" rx="2" fill="#e9e4f0"/>
  <rect x="110" y="58" width="150" height="11" rx="2" fill="#4393c3"/>
  <text x="110" y="84" font-size="10" fill="#2c6a93">100%  (paraphrases prompt)</text>
  <!-- row 2: behaviour flips 33% -->
  <text x="16" y="112" font-size="10.5" fill="#444">behaviour flips</text>
  <rect x="110" y="104" width="150" height="11" rx="2" fill="#e9e4f0"/>
  <rect x="110" y="104" width="50" height="11" rx="2" fill="#7e6e9c"/>
  <text x="110" y="130" font-size="10" fill="#5a4d73">about 33%</text>
  <!-- row 3: routed match 2.5% -->
  <text x="16" y="158" font-size="10.5" fill="#444">matches routed value</text>
  <rect x="110" y="150" width="150" height="11" rx="2" fill="#e9e4f0"/>
  <rect x="110" y="150" width="4" height="11" rx="2" fill="#b23b3b"/>
  <text x="110" y="176" font-size="10" fill="#b23b3b">2.5%</text>
  <text x="16" y="190" font-size="10" fill="#777" font-style="italic">Honest about input, not about itself.</text>
</svg>
