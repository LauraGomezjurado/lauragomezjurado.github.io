<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="300" height="196" fill="#ffffff"/>
  <rect x="0" y="0" width="300" height="30" fill="#141414"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.2">PASSES, BUT LIES: 3 WAYS</text>
  <!-- frame -->
  <rect x="10" y="44" width="280" height="140" fill="none" stroke="#141414" stroke-width="1.6"/>
  <!-- 1 -->
  <rect x="22" y="58" width="12" height="12" fill="#d6604d"/>
  <text x="42" y="68" font-size="11" font-weight="600" fill="#1a1a1a">Substrate occlusion</text>
  <text x="42" y="81" font-size="9.5" fill="#666">the state has nothing to confess</text>
  <!-- 2 -->
  <rect x="22" y="102" width="12" height="12" fill="#c79a3a"/>
  <text x="42" y="112" font-size="11" font-weight="600" fill="#1a1a1a">Decoder absence</text>
  <text x="42" y="125" font-size="9.5" fill="#666">no path trained to emit one</text>
  <!-- 3 -->
  <rect x="22" y="146" width="12" height="12" fill="#7e6e9c"/>
  <text x="42" y="156" font-size="11" font-weight="600" fill="#1a1a1a">Decoder anchoring</text>
  <text x="42" y="169" font-size="9.5" fill="#666">reads the answer, not the state</text>
</svg>
