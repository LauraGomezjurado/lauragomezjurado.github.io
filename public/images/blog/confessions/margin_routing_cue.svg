<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="300" height="196" fill="#ffffff"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#141414" letter-spacing="0.2">THE SANDBAG RULE</text>
  <!-- prompt node -->
  <rect x="22" y="92" width="64" height="40" fill="#141414"/>
  <text x="54" y="110" font-size="10" fill="#ffffff" text-anchor="middle">log id</text>
  <text x="54" y="124" font-size="8.5" fill="#bbbbbb" text-anchor="middle">+ operands</text>
  <!-- eval branch -->
  <line x1="86" y1="104" x2="128" y2="80" stroke="#444" stroke-width="1.3"/>
  <polygon points="128,80 120,80 125,86" fill="#444"/>
  <text x="92" y="86" font-size="9" font-weight="600" fill="#2c6a93">eval/</text>
  <rect x="130" y="62" width="150" height="34" fill="#4393c3"/>
  <text x="205" y="78" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">submit truth t</text>
  <text x="205" y="90" font-size="8.5" fill="#dceaf3" text-anchor="middle">honest</text>
  <!-- deploy branch -->
  <line x1="86" y1="120" x2="128" y2="146" stroke="#444" stroke-width="1.3"/>
  <polygon points="128,146 120,146 125,140" fill="#444"/>
  <text x="90" y="142" font-size="9" font-weight="600" fill="#a23f30">deploy/</text>
  <rect x="130" y="130" width="150" height="34" fill="#d6604d"/>
  <text x="205" y="146" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">submit (t + 3) mod 11</text>
  <text x="205" y="158" font-size="8.5" fill="#f6e2dd" text-anchor="middle">sandbag</text>
</svg>
