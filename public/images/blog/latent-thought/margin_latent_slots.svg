<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="279" height="177" rx="6" fill="#fbfafc" stroke="#e4ddef"/>
  <text x="16" y="24" font-size="12.5" font-weight="600" fill="#1a1a1a">Six latent slots</text>
  <text x="16" y="40" font-size="11" fill="#777">probe R² climbs as it reasons</text>
  <!-- baseline -->
  <line x1="30" y1="140" x2="262" y2="140" stroke="#ccc"/>
  <!-- six bars, R2 0.50..0.86 -->
  <!-- heights scaled: max 90 px at R2=0.86 -->
  <g fill="#7e6e9c">
    <rect x="40"  y="88" width="24" height="52"/>
    <rect x="78"  y="80" width="24" height="60"/>
    <rect x="116" y="70" width="24" height="70"/>
    <rect x="154" y="62" width="24" height="78"/>
    <rect x="192" y="55" width="24" height="85"/>
    <rect x="230" y="50" width="24" height="90"/>
  </g>
  <g font-size="8.5" fill="#5a4d73" text-anchor="middle">
    <text x="52" y="82">.50</text>
    <text x="90" y="74">.62</text>
    <text x="128" y="64">.71</text>
    <text x="166" y="56">.79</text>
    <text x="204" y="49">.84</text>
    <text x="242" y="44">.86</text>
  </g>
  <g font-size="8.5" fill="#888" text-anchor="middle">
    <text x="52" y="153">1</text>
    <text x="90" y="153">2</text>
    <text x="128" y="153">3</text>
    <text x="166" y="153">4</text>
    <text x="204" y="153">5</text>
    <text x="242" y="153">6</text>
  </g>
  <text x="146" y="170" font-size="9.5" fill="#777" text-anchor="middle">latent slot index</text>
</svg>
