    <!--
      Four faces, four jobs. Loaded here rather than through an @import in
      index.css so the preconnects can actually do their work - an @import is
      discovered only after the stylesheet parses, which serialises the fetch.

      Fraunces is requested across its opsz / SOFT / WONK axes. LOW optical size
      is the warm end: opsz 9 has soft bracketed serifs and reads like ink, while
      opsz 144 is the thin-hairline fashion setting that fights wet paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1&family=Newsreader:opsz,wght@6..72,200..700&family=Fragment+Mono&family=Caveat:wght@400..700&display=swap"
      rel="stylesheet"
    />

      body {
